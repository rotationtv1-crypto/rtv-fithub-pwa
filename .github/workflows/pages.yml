name: Import verified FitHub source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import two verified source snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FitHub Delivery Bot'
          git config user.email 'actions@users.noreply.github.com'
          curl --fail --location --silent --show-error 'https://customer-assets-jai6qajn.emergentagent.net/wingman/50783da3-9078-467e-b602-a492ec994019/attachments/becc29da2117498ebef050c0931fda87_first-commit.tar.gz' -o /tmp/fithub-one.tar.gz
          echo '75355b9ab6de591a97528077a3781cab98eac6422d8207f7abc55e371d79b795  /tmp/fithub-one.tar.gz' | sha256sum -c -
          tar -xzf /tmp/fithub-one.tar.gz -C .
          git add -A
          git commit -m 'Build offline workout PWA and Pages deployment'
          curl --fail --location --silent --show-error 'https://customer-assets-jai6qajn.emergentagent.net/wingman/50783da3-9078-467e-b602-a492ec994019/attachments/88a010ac2c704f33ad61ba263b6e7daa_second-commit.tar.gz' -o /tmp/fithub-two.tar.gz
          echo 'a23d414302813e44e0fef0e0264b721cdbee5ab8f62315632e4ed5be0c774bfb  /tmp/fithub-two.tar.gz' | sha256sum -c -
          tar -xzf /tmp/fithub-two.tar.gz -C .
          git add -A
          git commit -m 'Add optional Express wallet and PayPal demo API'
          git push origin HEAD:main
